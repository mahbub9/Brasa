name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Brasa.slnx

      # TreatWarningsAsErrors is on solution-wide, so this step is also the
      # analyzer gate and the transitive-vulnerability gate.
      - name: Build
        run: dotnet build Brasa.slnx --no-restore --configuration Release

      # Docker is present on GitHub runners, so Testcontainers-based integration
      # tests — which exercise PostgreSQL row-level security for real — run here
      # even when a developer machine cannot run them locally.
      - name: Test
        run: >
          dotnet test Brasa.slnx
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'
          retention-days: 14

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'

      # Vite 8 made rolldown a hard dependency, not an opt-in variant --
      # rolldown ships its native bundler binary as one of fourteen
      # per-platform optionalDependencies (@rolldown/binding-linux-x64-gnu
      # for this runner). The npm version actions/setup-node's node-version
      # happens to bundle has repeatedly failed to install the right one of
      # those for the current platform even though package-lock.json
      # correctly lists it -- a long-standing, still-recurring npm bug
      # (https://github.com/npm/cli/issues/4828), not anything wrong with
      # this repo's own lockfiles.
      - name: Upgrade npm
        run: npm install -g npm@latest

      # postgres has a healthcheck (pg_isready); --wait blocks until it passes.
      # seq has none, so --wait only waits for it to reach "running".
      - name: Start local infrastructure
        run: docker compose -f infra/docker-compose.yml up -d --wait

      # Debug, not Release: this is what `dotnet run --no-build` in
      # playwright.config.ts's webServer picks up, matching what a developer
      # runs locally per docs/development/getting-started.md.
      - name: Build API
        run: dotnet build Brasa.slnx --configuration Debug

      - name: Install pos dependencies
        run: npm install
        working-directory: src/web/pos

      # WEB-09/10 — admin is a second web client playwright.config.ts's own
      # webServer list now starts too (port 5174); its dependencies need
      # installing here the same way pos's do, or that webServer entry
      # fails outright.
      - name: Install admin dependencies
        run: npm install
        working-directory: src/web/admin

      # Upgrading npm (above) did not stop this crash on a real run --
      # #4828 (and its still-open sibling npm/cli#8320) is reported as
      # recurring even on current npm, root-caused to package-lock.json
      # having been generated on a different OS (this repo's lockfiles are
      # all generated on the maintainer's Windows machine) confusing npm's
      # optional-dependency install step for the *other* platform --
      # silently, rather than with a failed exit code, which is why the
      # "Install pos/admin dependencies" steps above report success right
      # before pos's or admin's own dev server crashes on startup. The
      # workaround that holds up across reports is to stop depending on
      # npm's optional-dependency resolution for the platform binary at
      # all: explicitly install the exact binding version each project's
      # own lockfile already pins rolldown to. --no-save keeps this
      # CI-only and out of the committed lockfiles.
      - name: Work around npm's optional-dependency bug for rolldown's native binding
        run: |
          for project in pos admin; do
            version=$(node -p "require('./src/web/$project/node_modules/rolldown/package.json').version")
            npm install --no-save --prefix "src/web/$project" "@rolldown/binding-linux-x64-gnu@$version"
          done

      - name: Install e2e dependencies
        run: npm install
        working-directory: src/web/e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: src/web/e2e

      # Starts the API, the pos dev server and the admin dev server
      # (playwright.config.ts webServer) — Docker is the only external
      # dependency.
      - name: Run E2E suite
        run: npx playwright test
        working-directory: src/web/e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/web/e2e/playwright-report/
          retention-days: 14

  openapi-drift:
    name: OpenAPI drift check
    runs-on: ubuntu-latest

    steps:
      # fetch-depth 2, not the default 1 -- the breaking-change check below
      # needs HEAD^'s own committed docs/openapi/v1.json to diff against, and
      # a depth-1 checkout has no parent commit to find it in.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Start local infrastructure
        run: docker compose -f infra/docker-compose.yml up -d --wait

      - name: Build API
        run: dotnet build Brasa.slnx --configuration Debug

      # API-14. docs/openapi/README.md documents regenerating
      # docs/openapi/v1.json by hand after any endpoint change — this job
      # is what actually enforces that step isn't forgotten, instead of
      # relying on remembering to run it. Catches every drift a
      # hand-regeneration step could silently miss, which is exactly what
      # happened earlier in this project's own history (FLR-04/CAT-01/13/17/19
      # all shipped before the committed document caught up).
      - name: Regenerate and diff the OpenAPI document
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          dotnet run --project src/backend/Brasa.Api --no-build &
          API_PID=$!

          ready=false
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:5216/health > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            echo "::error::API never became healthy within 30s."
            kill "$API_PID" 2>/dev/null || true
            exit 1
          fi

          curl -sf http://localhost:5216/openapi/v1.json | jq 'del(.servers)' > /tmp/openapi-live.json
          kill "$API_PID" 2>/dev/null || true

          if ! diff -u docs/openapi/v1.json /tmp/openapi-live.json; then
            echo "::error::docs/openapi/v1.json is out of date. Regenerate it (see docs/openapi/README.md) and commit the result in the same PR as the endpoint change that caused this drift."
            exit 1
          fi

      # The other half of API-14: not "is the committed file stale" (above)
      # but "compared to the previous commit's own released contract, did
      # anything just become a breaking change." check-breaking-changes.mjs
      # is a conservative, high-confidence subset (see its own header for
      # exactly what it does and doesn't catch) -- calibrated against this
      # repo's own real commit history, where it correctly flagged IDN-11's
      # manager-authorisation gate (a newly-required field on three
      # already-shipped endpoints) and correctly stayed silent on every
      # purely-additive commit. A report, not a blocker: a breaking change is
      # sometimes the intended one, exactly what IDN-11 legitimately did --
      # see api-contract.md's own versioning story for how this codebase
      # expects to actually handle one when it's real, not accidental.
      - name: Check for breaking changes against the previous commit (API-14)
        if: always() && !cancelled()
        run: |
          if git cat-file -e HEAD^:docs/openapi/v1.json 2>/dev/null; then
            git show HEAD^:docs/openapi/v1.json > /tmp/openapi-previous.json
            node infra/scripts/check-breaking-changes.mjs /tmp/openapi-previous.json docs/openapi/v1.json || true
          else
            echo "No docs/openapi/v1.json at HEAD^ to compare against -- skipping."
          fi

  vulnerable-packages:
    name: Vulnerable package scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The build already fails on NU1901-1904 via TreatWarningsAsErrors. This
      # job reports transitive advisories explicitly so a new CVE against an
      # unchanged dependency is visible rather than only surfacing on the next
      # unrelated build.
      - name: List vulnerable packages
        run: |
          dotnet restore Brasa.slnx
          dotnet list Brasa.slnx package --vulnerable --include-transitive
