name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Brasa.slnx

      # TreatWarningsAsErrors is on solution-wide, so this step is also the
      # analyzer gate and the transitive-vulnerability gate.
      - name: Build
        run: dotnet build Brasa.slnx --no-restore --configuration Release

      # Docker is present on GitHub runners, so Testcontainers-based integration
      # tests — which exercise PostgreSQL row-level security for real — run here
      # even when a developer machine cannot run them locally.
      - name: Test
        run: >
          dotnet test Brasa.slnx
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'
          retention-days: 14

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'

      # postgres has a healthcheck (pg_isready); --wait blocks until it passes.
      # seq has none, so --wait only waits for it to reach "running".
      - name: Start local infrastructure
        run: docker compose -f infra/docker-compose.yml up -d --wait

      # Debug, not Release: this is what `dotnet run --no-build` in
      # playwright.config.ts's webServer picks up, matching what a developer
      # runs locally per docs/development/getting-started.md.
      - name: Build API
        run: dotnet build Brasa.slnx --configuration Debug

      - name: Install pos dependencies
        run: npm install
        working-directory: src/web/pos

      # WEB-09/10 — admin is a second web client playwright.config.ts's own
      # webServer list now starts too (port 5174); its dependencies need
      # installing here the same way pos's do, or that webServer entry
      # fails outright.
      - name: Install admin dependencies
        run: npm install
        working-directory: src/web/admin

      - name: Install e2e dependencies
        run: npm install
        working-directory: src/web/e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: src/web/e2e

      # Starts the API, the pos dev server and the admin dev server
      # (playwright.config.ts webServer) — Docker is the only external
      # dependency.
      - name: Run E2E suite
        run: npx playwright test
        working-directory: src/web/e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/web/e2e/playwright-report/
          retention-days: 14

  vulnerable-packages:
    name: Vulnerable package scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The build already fails on NU1901-1904 via TreatWarningsAsErrors. This
      # job reports transitive advisories explicitly so a new CVE against an
      # unchanged dependency is visible rather than only surfacing on the next
      # unrelated build.
      - name: List vulnerable packages
        run: |
          dotnet restore Brasa.slnx
          dotnet list Brasa.slnx package --vulnerable --include-transitive
