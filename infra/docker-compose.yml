# Local development infrastructure.
#
# Credentials here are development-only and committed on purpose: they grant
# access to nothing but a container on your own machine. Production secrets never
# live in this repository — see docs/fiscal/key-management.md.
#
#   docker compose -f infra/docker-compose.yml up -d
#
# Two Postgres roles exist, and the split matters:
#   brasa      the POSTGRES_USER bootstrap role. It is a SUPERUSER, and
#              superusers bypass row-level security unconditionally. Used only
#              for running migrations (DDL, RLS policy creation).
#   brasa_app  an ordinary role created by infra/initdb/01-app-role.sql, with no
#              superuser or BYPASSRLS attribute. The application connects as
#              this role at runtime, so RLS actually applies.
# See docs/architecture/multi-tenancy.md.

name: brasa

services:
  postgres:
    image: postgres:18-alpine
    container_name: brasa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: brasa
      POSTGRES_PASSWORD: devonly
      POSTGRES_DB: brasa
      # Portuguese collation, so local sorting matches production.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=pt-PT --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ images store data in a major-version subdirectory
      # (/var/lib/postgresql/18/docker) so that `pg_upgrade --link` works without
      # crossing a mount boundary. Mount the PARENT, not .../data — mounting
      # .../data makes the container refuse to start.
      # https://github.com/docker-library/postgres/pull/1259
      - pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brasa -d brasa"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Structured log viewer. Serilog writes here in Development.
  seq:
    image: datalust/seq:latest
    container_name: brasa-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # A newer Seq release started requiring an explicit first-run admin
      # password (or this opt-out) and refuses to start without one — this
      # container was silently crash-looping until this was added. No auth
      # is fine here: this binds to localhost only, on a solo developer's
      # own machine, the same trust level as Postgres's devonly/brasa
      # credentials above.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seqdata:/data

volumes:
  pgdata:
  seqdata:
